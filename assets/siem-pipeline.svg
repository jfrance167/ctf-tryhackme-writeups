<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SIEM evidence pipeline</title>
  <desc id="desc">Log sources flow through collection, normalization, correlation, and analyst response.</desc>
  <rect width="1200" height="320" fill="#0f172a" rx="18"/>
  <style>text{font-family:Arial,sans-serif;fill:#e2e8f0}.h{font-size:25px;font-weight:bold}.s{font-size:17px}.box{fill:#1e293b;stroke:#38bdf8;stroke-width:2}.arrow{stroke:#a3e635;stroke-width:5;fill:none}</style>
  <text x="52" y="52" class="h">SIEM investigation pipeline</text>
  <g transform="translate(48 105)">
    <rect class="box" width="185" height="115" rx="12"/><text x="24" y="42" class="h">Log sources</text><text x="24" y="73" class="s">Endpoints · Servers</text><text x="24" y="98" class="s">Firewalls · Web apps</text>
    <path class="arrow" d="M195 58H246"/><path fill="#a3e635" d="M246 50l16 8-16 8z"/>
    <g transform="translate(270)"><rect class="box" width="185" height="115" rx="12"/><text x="29" y="48" class="h">Collection</text><text x="33" y="80" class="s">Agents / APIs</text></g>
    <path class="arrow" d="M465 58H516"/><path fill="#a3e635" d="M516 50l16 8-16 8z"/>
    <g transform="translate(540)"><rect class="box" width="185" height="115" rx="12"/><text x="14" y="42" class="h">Normalization</text><text x="32" y="75" class="s">Parse fields</text><text x="21" y="99" class="s">Add context</text></g>
    <path class="arrow" d="M735 58H786"/><path fill="#a3e635" d="M786 50l16 8-16 8z"/>
    <g transform="translate(810)"><rect class="box" width="185" height="115" rx="12"/><text x="18" y="42" class="h">Correlation</text><text x="26" y="75" class="s">Rules + timeline</text><text x="32" y="99" class="s">Alert triage</text></g>
  </g>
  <text x="52" y="280" class="s">Use this diagram with redacted screenshots of the actual alert, event timeline, and response decision.</text>
</svg>
